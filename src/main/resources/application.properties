spring.application.name=financial-ledger
server.port=8080

# SQLite Configuration (WAL mode and foreign keys enabled per DB-02)
spring.datasource.url=jdbc:sqlite:financial_ledger.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Actuator Health endpoint mapping for SK-02
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
