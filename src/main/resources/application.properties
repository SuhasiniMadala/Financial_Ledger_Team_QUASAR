spring.application.name=financial-ledger
server.port=8080

# ---- Ledger settings (documented in README.md "Configuration") ----
# DB-01: one SQLite file, path configurable
ledger.db.path=financial_ledger.db
# DB-02 / FR-CON-06: how long a request waits for the single write lock before HTTP 503
ledger.db.busy-timeout-ms=5000
ledger.db.pool-size=8
# TBD-1 (ADR-008): supported wallet currencies; INR is mandatory
ledger.currencies=INR,USD
# BR-02 / TBD-2 (ADR-008): per-transaction limit in minor units (10000000 paise = Rs 1,00,000.00)
ledger.max-amount-minor=10000000
# NFR-SEC-01: BCrypt work factor (must be >= 10)
ledger.bcrypt-strength=10

# NFR-SEC-02: the JWT secret comes ONLY from the environment, never from this file
ledger.jwt.secret=${LEDGER_JWT_SECRET:}
ledger.jwt.expiry-minutes=60
ledger.jwt.allow-ephemeral-secret=false

# FR-AUTH-05: the admin account is created from deployment configuration only
ledger.admin.email=${LEDGER_ADMIN_EMAIL:}
ledger.admin.password=${LEDGER_ADMIN_PASSWORD:}
ledger.admin.display-name=Platform Admin

# The schema is created at start-up. Statements are separated by @@ because trigger bodies contain ';'.
spring.sql.init.mode=always
spring.sql.init.separator=@@

# NFR-SEC-04 / TQ-6: amounts must be JSON integers; no silent float->int or string->int coercion
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.default-property-inclusion=non_null

# NFR-SEC-06: never expose stack traces or exception messages
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
