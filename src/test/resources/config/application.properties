# Test configuration (TQ-5 / NFR-TEST-05): every Spring test context gets a brand-new SQLite file.
# ${random.uuid} is resolved once per context, so test runs never share or reuse data.
ledger.db.path=target/test-db/ledger-${random.uuid}.db
ledger.db.busy-timeout-ms=5000
ledger.db.pool-size=8
ledger.currencies=INR,USD
ledger.max-amount-minor=10000000
ledger.bcrypt-strength=10

# No JWT secret is stored anywhere: tests use a random key generated at start-up (NFR-SEC-02)
ledger.jwt.allow-ephemeral-secret=true
ledger.jwt.expiry-minutes=60

# Synthetic, test-only admin (not a real credential)
ledger.admin.email=admin@ledger.test
ledger.admin.password=test-test-test-test
ledger.admin.display-name=Test Admin
