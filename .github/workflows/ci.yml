# Financial Ledger CI (SDLC section 4): runs on EVERY pull request and on pushes to main.
# Jobs: build, lint, tests (+ coverage rule), secret scanning, SKILL.md validation, brain validation,
# and the local-check skill on a clean machine. Documentation: docs/ci/ci-pipeline.md
name: Financial Ledger CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Compile and package (tests run in the Tests job)
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip=true package


  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Checkstyle - fails on any violation
        run: mvn -B -ntp checkstyle:check


  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Full test suite on fresh databases + JaCoCo coverage rule (NFR-TEST-05, NFR-TEST-07)
        run: mvn -B -ntp verify
      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14


  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  validate-skills:
    name: Validate Agent Skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate SKILL.md frontmatter and naming
        run: |
          python3 -c "
          import os, sys, glob, re

          skill_files = glob.glob('**/SKILL.md', recursive=True)
          # filter out .git
          skill_files = [f for f in skill_files if not f.startswith('.git')]
          if not skill_files:
              print('No skill files found!')
              sys.exit(1)

          errors = 0
          for fpath in skill_files:
              with open(fpath, 'r', encoding='utf-8') as f:
                  content = f.read()
              if not content.startswith('---'):
                  print(f'Error in {fpath}: Missing leading YAML frontmatter separator ---')
                  errors += 1
              if not re.search(r'^name:\s+[\w\-]+', content, re.MULTILINE):
                  print(f'Error in {fpath}: Missing valid name field in frontmatter')
                  errors += 1
              if not re.search(r'^description:\s+.+', content, re.MULTILINE):
                  print(f'Error in {fpath}: Missing valid description field in frontmatter')
                  errors += 1
              print(f'Validated skill: {fpath}')

          if errors > 0:
              sys.exit(1)
          print('All SKILL.md files are valid!')
          "


  brain:
    name: Validate brain notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: PARA structure, note schema, broken wikilinks, ADR citations (BrainVaultTest)
        run: mvn -B -ntp -Dcheckstyle.skip=true -Djacoco.skip=true -Dtest=BrainVaultTest test


  local-check:
    name: local-check skill on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run local-check (build, tests, start, GET /api/v1/health, stop)
        shell: pwsh
        run: ./brain/skills/local-check/scripts/local-check.ps1 -ReportPath target/local-check-report.md
      - name: Show the report on the run summary page
        if: always()
        run: cat target/local-check-report.md >> "$GITHUB_STEP_SUMMARY" || true
