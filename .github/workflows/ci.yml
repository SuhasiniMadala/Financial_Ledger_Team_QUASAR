# Financial Ledger CI (SDLC section 4)
# Runs on every pull request and on pushes to main.
# Seven jobs:
# build, lint, tests + coverage, secret scanning,
# SKILL.md validation, brain validation, and local-check.

name: Financial Ledger CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 1. BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile and package
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip=true package


  # 2. LINT
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Checkstyle - fail on violations
        run: mvn -B -ntp checkstyle:check


  # 3. TESTS AND COVERAGE
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Full test suite and JaCoCo coverage
        run: mvn -B -ntp verify

      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14


  # 4. SECRET SCANNING
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # 5. SKILL VALIDATION
  validate-skills:
    name: Validate Agent Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate SKILL.md frontmatter and naming
        shell: python
        run: |
          import sys
          import glob
          import re

          skill_files = glob.glob('**/SKILL.md', recursive=True)
          skill_files = [
              path for path in skill_files
              if not path.startswith('.git/')
          ]

          if not skill_files:
              print('ERROR: No SKILL.md files found!')
              sys.exit(1)

          errors = 0

          for path in skill_files:
              with open(path, encoding='utf-8') as file:
                  content = file.read()

              if not content.startswith('---\n'):
                  print(f'ERROR: {path}: Missing YAML frontmatter.')
                  errors += 1
                  continue

              parts = content.split('---', 2)

              if len(parts) < 3:
                  print(f'ERROR: {path}: Frontmatter is not closed.')
                  errors += 1
                  continue

              frontmatter = parts[1]

              if not re.search(
                  r'^name:\s*[\w-]+\s*$',
                  frontmatter,
                  re.MULTILINE
              ):
                  print(f'ERROR: {path}: Missing valid name field.')
                  errors += 1

              if not re.search(
                  r'^description:\s*.+$',
                  frontmatter,
                  re.MULTILINE
              ):
                  print(f'ERROR: {path}: Missing description field.')
                  errors += 1

              if not errors:
                  print(f'Validated: {path}')

          if errors:
              print(f'Skill validation FAILED: {errors} error(s).')
              sys.exit(1)

          print(f'All {len(skill_files)} SKILL.md files are valid!')


  # 6. SECOND BRAIN VALIDATION
  validate-brain-notes:
    name: Validate Second Brain Notes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Brain Notes and Wikilinks
        shell: python
        run: |
          import os
          import sys
          import glob
          import re

          brain_files = [
                path for path in glob.glob('brain/**/*.md', recursive=True)
                if not path.startswith('brain/skills/')
            ]

          print(f'Found {len(brain_files)} notes in brain vault.')

          if len(brain_files) < 10:
              print(
                  f'ERROR: Expected at least 10 notes, '
                  f'found {len(brain_files)}.'
              )
              sys.exit(1)

          # Build a case-insensitive index of note filenames.
          note_names = {
              os.path.splitext(os.path.basename(path))[0].lower()
              for path in brain_files
          }

          broken_links = 0

          for path in brain_files:
              with open(path, encoding='utf-8') as file:
                  content = file.read()

              wikilinks = re.findall(r'\[\[(.*?)\]\]', content)

              for link in wikilinks:
                  # Support aliases such as [[Target|Display text]]
                  target = link.split('|', 1)[0].strip()

                  # Support heading links such as [[Target#Section]]
                  target = target.split('#', 1)[0].strip()

                  normalized_target = target.lower().replace(' ', '-')

                  if (
                      normalized_target not in note_names
                      and target.lower() not in note_names
                  ):
                      print(
                          f'ERROR: Broken wikilink [[{link}]] '
                          f'in {path}'
                      )
                      broken_links += 1

          if broken_links > 0:
              print(
                  f'Brain validation FAILED: '
                  f'{broken_links} broken wikilink(s).'
              )
              sys.exit(1)

          print('Brain validation completed successfully!')


  # 7. LOCAL-CHECK
  local-check:
    name: local-check skill on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run local-check
        shell: pwsh
        run: |
          ./brain/skills/local-check/scripts/local-check.ps1 `
            -ReportPath target/local-check-report.md

      - name: Show report on the run summary page
        if: always()
        run: |
          if [ -f target/local-check-report.md ]; then
            cat target/local-check-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Local-check report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
