# Financial Ledger CI (SDLC section 4): runs on EVERY pull request and on pushes to main.
# Jobs: build, lint, tests (+ coverage rule), secret scanning, SKILL.md validation, brain validation,
# and the local-check skill on a clean machine. Documentation: docs/ci/ci-pipeline.md
name: Financial Ledger CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Compile and package (tests run in the Tests job)
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip=true package

  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Checkstyle - fails on any violation
        run: mvn -B -ntp checkstyle:check

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Full test suite on fresh databases + JaCoCo coverage rule (NFR-TEST-05, NFR-TEST-07)
        run: mvn -B -ntp verify
      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skills:
    name: Validate SKILL.md files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Agent Skills format, naming and distilled-note citations (SkillDefinitionsTest)
        run: mvn -B -ntp -Dcheckstyle.skip=true -Djacoco.skip=true -Dtest=SkillDefinitionsTest test

  brain:
    name: Validate brain notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: PARA structure, note schema, broken wikilinks, ADR citations (BrainVaultTest)
        run: mvn -B -ntp -Dcheckstyle.skip=true -Djacoco.skip=true -Dtest=BrainVaultTest test

  local-check:
    name: local-check skill on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run local-check (build, tests, start, GET /api/v1/health, stop)
        shell: pwsh
        run: ./brain/skills/local-check/scripts/local-check.ps1 -ReportPath target/local-check-report.md
      - name: Show the report on the run summary page
        if: always()
        run: cat target/local-check-report.md >> "$GITHUB_STEP_SUMMARY" || true
