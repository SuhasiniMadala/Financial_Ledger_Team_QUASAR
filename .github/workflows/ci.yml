# Financial Ledger CI (SDLC section 4): runs on EVERY pull request and on pushes to main.
# Jobs: build, lint, tests (+ coverage rule), secret scanning, SKILL.md validation, brain validation,
# the local-check skill on a clean machine, and (Stage 4) the React client: lint, types, tests, build, and its
# API modules against a real backend. Documentation: docs/ci/ci-pipeline.md
name: Financial Ledger CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Compile and package (tests run in the Tests job)
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip=true package

  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Checkstyle - fails on any violation
        run: mvn -B -ntp checkstyle:check

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Full test suite on fresh databases + JaCoCo coverage rule (NFR-TEST-05, NFR-TEST-07)
        run: mvn -B -ntp verify
      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skills:
    name: Validate SKILL.md files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Agent Skills format, naming and distilled-note citations (SkillDefinitionsTest)
        run: mvn -B -ntp -Dcheckstyle.skip=true -Djacoco.skip=true -Dtest=SkillDefinitionsTest test

  brain:
    name: Validate brain notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: PARA structure, note schema, broken wikilinks, ADR citations (BrainVaultTest)
        run: mvn -B -ntp -Dcheckstyle.skip=true -Djacoco.skip=true -Dtest=BrainVaultTest test

  local-check:
    name: local-check skill on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run local-check (build, tests, start, GET /api/v1/health, stop)
        shell: pwsh
        run: ./brain/skills/local-check/scripts/local-check.ps1 -ReportPath target/local-check-report.md
      - name: Show the report on the run summary page
        if: always()
        run: cat target/local-check-report.md >> "$GITHUB_STEP_SUMMARY" || true

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint (includes the TQ-6 no-parseFloat rule)
        run: npm run lint
      - name: TypeScript type check
        run: npm run typecheck
      - name: Unit and component tests (UI-01..UI-05)
        run: npm test
      - name: Production build
        run: npm run build

  frontend-integration:
    name: Frontend integration (real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the backend jar
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip=true package
      - name: Start the backend on a fresh database (admin password generated for this job only, never stored)
        run: |
          echo "LEDGER_ADMIN_EMAIL=admin@ci.test" >> "$GITHUB_ENV"
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          echo "LEDGER_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          LEDGER_ADMIN_EMAIL=admin@ci.test LEDGER_ADMIN_PASSWORD="$PASSWORD" \
            nohup java -jar target/financial-ledger-*.jar --ledger.db.path="$RUNNER_TEMP/ci-ledger.db" \
            --ledger.jwt.allow-ephemeral-secret=true > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Client API modules against the real backend (ends with reconciliation PASS)
        working-directory: frontend
        run: |
          npm ci
          npm run test:integration
      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
